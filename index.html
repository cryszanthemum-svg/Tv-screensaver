<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>Google TV YouTube Screensaver</title>
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000}
    #player{position:fixed;inset:0;width:100%;height:100%;border:0}
  </style>
</head>
<body>
  <iframe id="player" title="YouTube screensaver"
    src="https://www.youtube.com/embed/kQ0LWl1o3oo?autoplay=1&amp;mute=1&amp;loop=1&amp;playlist=kQ0LWl1o3oo&amp;controls=0&amp;playsinline=1&amp;rel=0&amp;iv_load_policy=3"
    allow="autoplay; encrypted-media; fullscreen; picture-in-picture"
    referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
</body>
</html>
